# Soft Graphite: KWin settings. Merge key by key (tools/merge-kconfig.py), do not replace the file.
[Plugins]
soft-graphite-fullscreenEnabled=true
softgraphite-resizeEnabled=true
softgraphite-to-iconEnabled=true
softgraphite_cornersEnabled=true
softgraphite_layers_v10Enabled=true
softgraphite_outline_resizeEnabled=true
fadeEnabled=true
fullscreenEnabled=false
maximizeEnabled=false
scaleEnabled=false
squashEnabled=false
kwin4_effect_shapecornersEnabled=false

[org.kde.kdecoration2]
library=org.leonid.softgraphite.aurorae_pair
theme=__aurorae__svg__SoftGraphiteUnified
BorderSize=None
BorderSizeAuto=false
ButtonsOnLeft=
ButtonsOnRight=
ShowToolTips=false

[Windows]
BorderlessMaximizedWindows=true
ElectricBorderCornerRatio=0
ElectricBorderMaximize=false
ElectricBorderTiling=false
Placement=Centered

[ElectricBorders]
TopLeft=None

[EdgeBarrier]
CornerBarrier=false
EdgeBarrier=0

[TabBox]
HighlightWindows=false
MultiScreenMode=1

[Effect-fade]
FadeInTime=240
FadeOutTime=55

[Effect-slidingpopups]
SlideInTime=180
SlideOutTime=320

[Effect-overview]
BorderActivate=9

[Round-Corners]
AnimationDuration=200
DisableOutlineFullScreen=true
DisableOutlineMaximize=true
DisableOutlineTile=true
DisableRoundFullScreen=true
DisableRoundMaximize=true
DisableRoundTile=true
InactiveCornerRadius=12
InactiveOuterOutlineThickness=0
InactiveOutlineThickness=0
InactiveSecondOutlineThickness=0
IncludeDialogs=true
IncludeNormalWindows=true
MarkWindowsTranslucent=true
OuterOutlineThickness=0
OutlineThickness=0
SecondOutlineThickness=0
Size=12
UseNativeDecorationShadows=true
UseSquircleShape=false
