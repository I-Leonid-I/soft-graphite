# Soft Graphite window rules. Merge into ~/.config/kwinrulesrc;
# append these names to [General] rules= / Order= (keep existing rules first).

[soft-graphite-telegram-media-native]
decorationpolicy=server
decorationpolicyrule=1
description=Soft Graphite — не изменять штатный просмотр медиа Telegram
enabled=true
fullscreenrule=1
maximizehorizrule=1
maximizevertrule=1
title=^(Просмотр медиа|Media viewer|Media Viewer)$
titlematch=3
types=1
wmclass=org.telegram.desktop
wmclasscomplete=false
wmclassmatch=1

[soft-graphite-browser-frame]
decorationpolicy=server
decorationpolicyrule=3
description=Soft Graphite — рамка браузера только в обычном окне
enabled=true
noborder=false
types=1
wmclass=^(google-chrome(-stable|-beta|-unstable)?|chromium(-browser)?|firefox|org[.]mozilla[.]firefox|brave-browser|microsoft-edge|vivaldi-stable|yandex-browser(?: [(].*[)])?|ru[.]yandex[.]Browser|com[.]microsoft[.]VSCode(?:Insiders)?|code(?:-oss|-insiders)?|VSCodium|codium|[Cc]hat[Gg][Pp][Tt]|[Aa]ntigravity)$
wmclasscomplete=false
wmclassmatch=3

[soft-graphite-system-frame]
decorationpolicy=server
decorationpolicyrule=2
description=Soft Graphite — общая рамка приложений
enabled=true
noborder=false
types=289
wmclasscomplete=false
wmclassmatch=0

[soft-graphite-windowed-start]
description=Soft Graphite — обычное окно при запуске
enabled=true
fullscreen=false
fullscreenrule=3
maximizehoriz=false
maximizehorizrule=3
maximizevert=false
maximizevertrule=3
types=1
wmclass=^(?!org[.]kde[.]spectacle$).*
wmclasscomplete=false
wmclassmatch=3
