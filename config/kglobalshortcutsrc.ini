# Free Meta+Up/Left/Right for the Soft Graphite KWin script (it registers its own
# shortcuts: Meta+Up fullscreen, Meta+Left/Right halves, Meta+Ctrl+F toggle).
# Edit with kwriteconfig6 only while logged out, or via System Settings > Shortcuts:
# kglobalaccel overwrites this file while running.
[kwin]
Window Quick Tile Top=none,Meta+Up,Quick Tile Window to the Top
Window Quick Tile Left=none,Meta+Left,Quick Tile Window to the Left
Window Quick Tile Right=none,Meta+Right,Quick Tile Window to the Right
Window Quick Tile Bottom=none,Meta+Down,Quick Tile Window to the Bottom

[services][org.kde.spectacle.desktop]
RectangularRegionScreenShot=Meta+Shift+S\tMeta+Shift+Print
_launch=Print
